general {
    # Lock screen via Noctalia native IPC command before system suspend
    before_sleep_cmd = noctalia msg session lock
    # Ensure display output turns back on upon wake-up
    after_sleep_cmd = hyprctl dispatch dpms on
    # CRITICAL: Respect active dbus & systemd idle inhibitors (Caffeine / systemd-inhibit)
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# RULE 1: Screen DPMS Off (2 Minutes)
listener {
    timeout = 120
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# RULE 2: System Suspend (5 Minutes)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
