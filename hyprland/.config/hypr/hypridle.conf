general {
    # Define primary lock command (used by loginctl lock-session & hypridle)
    lock_cmd = uwsm app -- noctalia msg session lock

    # Lock the screen prior to system suspend
    before_sleep_cmd = loginctl lock-session

    # Ensure display output turns back on upon user activity after wake
    after_sleep_cmd = hyprctl dispatch dpms on

    # CRITICAL: Respect active dbus & systemd idle inhibitors (idle-toggle / Caffeine)
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# RULE 1: Lock Screen (2 Minutes)
# Lock screen first so display power-off doesn't leave session exposed on wake
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

# RULE 2: Screen DPMS Off (2.5 Minutes)
# Turn off display shortly after locking to conserve battery on Dell Precision
listener {
    timeout = 150
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# RULE 3: System Suspend (5 Minutes)
listener {
    timeout = 300
    on-timeout = systemctl suspend
}
