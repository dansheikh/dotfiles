# Starship Configuration - Minimal Clean with Right-Aligned Info
# Location: ~/.config/starship.toml

# ============================================================================
# General Settings
# ============================================================================
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
$fill\
$kubernetes\
$terraform\
$docker_context\
${custom.podman}\
$python\
$nodejs\
$bun\
$deno\
$rust\
$golang\
$lua\
$jobs\
$cmd_duration
$status$character"""

right_format = ""
continuation_prompt = '[∙](bright-black) '
command_timeout = 500
scan_timeout = 10
add_newline = true

# ============================================================================
# Fill - Pushes language & cloud context to the far right
# ============================================================================
[fill]
symbol = ' '
disabled = false

# ============================================================================
# Character (Prompt Symbol)
# ============================================================================
[character]
success_symbol = '[](bold green) '
error_symbol = '[](bold red) '
vimcmd_symbol = '[](bold green) '

# ============================================================================
# Status (Exit Code)
# ============================================================================
[status]
style = 'bold red'
symbol = '✖ '
format = '[$symbol$status]($style) '
disabled = false
recognize_signal_code = true
pipestatus = false

# ============================================================================
# Username & Hostname
# ============================================================================
[username]
style_user = 'bold yellow'
style_root = 'bold red'
format = '[$user]($style) '
show_always = false
disabled = false

[hostname]
ssh_only = true
ssh_symbol = '󰒍 '
format = '[@$hostname]($style) '
style = 'bold cyan'
disabled = false

# ============================================================================
# Directory
# ============================================================================
[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' 󰌾'
style = 'bold cyan'
home_symbol = '~'
repo_root_style = 'bold blue'
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

# ============================================================================
# Git
# ============================================================================
[git_branch]
symbol = '󰊢 '
style = 'bold purple'
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_length = 25
truncation_symbol = '…'
always_show_remote = false

[git_commit]
commit_hash_length = 7
format = '[$hash$tag]($style) '
style = 'bold green'
only_detached = true
disabled = false
tag_symbol = '🏷 '
tag_disabled = false

[git_status]
style = 'bold red'
format = '([$all_status$ahead_behind]($style) )'
ahead = '[⇡$count](bold cyan) '
behind = '[⇣$count](bold cyan) '
diverged = '[⇕$ahead_count⇣$behind_count](bold cyan) '
conflicted = '[=$count](bold red) '
deleted = '[-$count](bold red) '
renamed = '[~$count](bold blue) '
modified = '[Δ$count](bold yellow) '
staged = '[+$count](bold green) '
untracked = '[?$count](yellow) '
stashed = '[$$count](bold magenta) '
disabled = false
ignore_submodules = false

[git_state]
format = '[\\([$state( $progress_current/$progress_total)]($style)\\) ]($style)'
style = 'bold yellow'

[git_metrics]
disabled = true

# ============================================================================
# Cloud & Infrastructure (Kubernetes & Terraform)
# ============================================================================
[kubernetes]
symbol = '󱃾 '
style = 'bold blue'
format = '[$symbol$context( \\($namespace\\))]($style) '
disabled = false
# Performance: Only evaluate when k8s configs or manifests exist in directory tree
detect_files = ['k8s', 'kubeconfig']
detect_extensions = ['k8s.yaml', 'k8s.yml']

# Map long/cryptic cluster ARNs/contexts to cleaner labels
[kubernetes.context_aliases]
'arn:aws:eks:(?P<var_region>[\\w-]+):(?P<var_account>[\\d]+):cluster/(?P<var_name>[\\w-]+)' = '$var_name'
'gke_.*_(?P<var_cluster>[\\w-]+)' = '$var_cluster'

[terraform]
symbol = '󱁢 '
style = 'bold 105'
format = '[$symbol$workspace]($style) '
detect_extensions = ['tf', 'tfvars']
detect_files = ['.terraform']
disabled = false

# ============================================================================
# Containers
# ============================================================================
[docker_context]
symbol = '󰡨 '
style = 'bold blue'
format = '[$symbol$context]($style) '
only_with_files = true
detect_files = [
  'docker-compose.yml',
  'docker-compose.yaml',
  'Dockerfile',
  'Containerfile',
]
detect_folders = []

[custom.podman]
symbol = ' '
style = 'bold purple'
format = '[$symbol$output]($style) '
command = "podman system connection default --format '{{.Name}}'"
detect_files = ['Containerfile', 'podman-compose.yml', 'podman-compose.yaml']
detect_extensions = ['containerfile']
when = 'command -v podman'

# ============================================================================
# Runtimes & Languages
# ============================================================================
[python]
symbol = '󱔎 '
style = 'bold yellow'
format = '[$symbol$version]($style) '
pyenv_version_name = false
python_binary = ['python3', 'python']
detect_extensions = ['py']
detect_files = [
  'requirements.txt',
  'pyproject.toml',
  'Pipfile',
  'setup.py',
  '.python-version',
]
detect_folders = ['.venv', 'venv']

[nodejs]
symbol = '󰎙 '
style = 'bold 40'
format = '[$symbol$version]($style) '
detect_extensions = ['js', 'mjs', 'cjs', 'ts', 'mts', 'cts']
detect_files = [
  'package.json',
  '.node-version',
  '.nvmrc',
  '!bunfig.toml',
  '!bun.lock',
  '!bun.lockb',
  '!deno.json',
  '!deno.jsonc',
  '!deno.lock',
]
detect_folders = ['node_modules']

[bun]
symbol = '󰒓 '
style = 'bold 218'
format = '[$symbol$version]($style) '
detect_extensions = []
detect_files = ['bunfig.toml', 'bun.lock', 'bun.lockb']

[deno]
symbol = '🦕 '
style = 'bold 75'
format = '[$symbol$version]($style) '
detect_extensions = []
detect_files = ['deno.json', 'deno.jsonc', 'deno.lock', 'mod.ts', 'deps.ts']

[rust]
symbol = '󱘗 '
style = 'bold red'
format = '[$symbol$version]($style) '
detect_extensions = ['rs']
detect_files = ['Cargo.toml', 'Cargo.lock']

[golang]
symbol = '󰟓 '
style = 'bold cyan'
format = '[$symbol$version]($style) '
detect_extensions = ['go']
detect_files = ['go.mod', 'go.sum', 'go.work']
detect_folders = []

[lua]
symbol = '󰢱 '
style = 'bold blue'
format = '[$symbol$version]($style) '
detect_extensions = ['lua']
detect_files = ['.lua-version']
detect_folders = ['lua']

# ============================================================================
# Execution Metrics & Jobs
# ============================================================================
[cmd_duration]
min_time = 2_000
format = '[󱎫 $duration]($style) '
style = 'bold yellow'
show_milliseconds = false

[jobs]
symbol = '✦ '
style = 'bold blue'
number_threshold = 1
symbol_threshold = 1
format = '[$symbol$number]($style) '
