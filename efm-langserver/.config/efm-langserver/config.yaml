version: 2

root-markers:
  - .git/
  - package.json
  - go.mod
  - pyproject.toml
  - Cargo.toml
  - flake.nix

lint-debounce: 300ms

lint-after-open: true
lint-on-save: true

tools:
  # ============================================================================
  # Oxlint (Oxc toolchain)
  # ============================================================================
  oxlint: &oxlint
    lint-command: "bunx --bun --no-install oxlint --format unix --stdin-filename ${INPUT}"
    lint-stdin: true
    lint-source: "oxlint"
    lint-ignore-exit-code: true
    lint-formats:
      - "%f:%l:%c: %m [%trror]"
      - "%f:%l:%c: %m [%tarning]"
      - "%f:%l:%c: %m"
      - "%-G%.%#"
    lint-category-map:
      E: E
      W: W
      I: I
      H: H
    root-markers:
      - .oxlintrc.json
      - .oxlintrc.jsonc
      - oxlint.config.ts
      - oxlint.config.js
      - package.json

  # ============================================================================
  # Go - golangci-lint
  # ============================================================================
  golangci-lint: &golangci-lint
    lint-command: "golangci-lint run --out-format=line-number --print-issued-lines=false ${INPUT}"
    lint-formats:
      - "%f:%l:%c: %m"
      - "%-G%.%#"
    lint-source: "golangci-lint"
    lint-ignore-exit-code: true
    lint-stdin: false
    root-markers:
      - go.mod
      - .golangci.yml
      - .golangci.yaml
      - .golangci.toml
      - .golangci.json

  # ============================================================================
  # JSON - jq
  # ============================================================================
  json-jq: &json-jq
    lint-command: "jq ."
    lint-stdin: true
    lint-source: "jq"
    lint-formats:
      - "parse error: %m at line %l, column %c"
      - "%-G%.%#"

  # ============================================================================
  # Python - Ruff & Mypy
  # ============================================================================
  python-ruff: &python-ruff
    lint-command: "ruff check --output-format concise --stdin-filename ${INPUT} -"
    lint-source: "ruff"
    lint-formats:
      - "%f:%l:%c: %m"
      - "%-G%.%#"
    lint-ignore-exit-code: true
    lint-stdin: true
    root-markers:
      - pyproject.toml
      - ruff.toml
      - .ruff.toml

  python-mypy: &python-mypy
    lint-command: "mypy --show-column-numbers --no-error-summary ${INPUT}"
    lint-source: "mypy"
    lint-formats:
      - "%f:%l:%c: %trror: %m"
      - "%f:%l:%c: %tarning: %m"
      - "%f:%l:%c: %tote: %m"
      - "%-G%.%#"
    lint-stdin: false
    lint-category-map:
      E: E
      W: W
      N: I
    root-markers:
      - pyproject.toml
      - mypy.ini
      - setup.cfg

  # ============================================================================
  # SQL - sqlfluff
  # ============================================================================
  sqlfluff: &sqlfluff
    lint-command: "sqlfluff lint --stdin-filename ${INPUT} -"
    lint-source: "sqlfluff"
    lint-formats:
      - "%-P== %#[%f] %#%*[A-Z]"
      - "%AL: %#%l %#| %#P: %# %c %#| %*[A-Z0-9] | %#%m"
      - "%C %#| %#[%m]"
      - "%ZAll %#Finished%.%#%-Q"
      - "%-G%.%#"
    lint-ignore-exit-code: true
    lint-stdin: true
    root-markers:
      - .sqlfluff
      - .sqlfluffignore
      - pyproject.toml

  # ============================================================================
  # YAML - yamllint
  # ============================================================================
  yamllint: &yamllint
    lint-command: "yamllint -f parsable -"
    lint-source: "yamllint"
    lint-formats:
      - "%f:%l:%c: [%tarning] %m"
      - "%f:%l:%c: [%trror] %m"
      - "%-G%.%#"
    lint-stdin: true
    root-markers:
      - .yamllint
      - .yamllint.yaml
      - .yamllint.yml

  # ============================================================================
  # Shell - shellcheck
  # ============================================================================
  shellcheck: &shellcheck
    lint-command: "shellcheck -f gcc -x -"
    lint-formats:
      - "%f:%l:%c: %trror: %m [SC%n]"
      - "%f:%l:%c: %tarning: %m [SC%n]"
      - "%f:%l:%c: %tote: %m [SC%n]"
      - "%-G%.%#"
    lint-stdin: true
    lint-source: "shellcheck"
    lint-category-map:
      E: E
      W: W
      N: I
      S: H

  # ============================================================================
  # Markdown - markdownlint
  # ============================================================================
  markdownlint: &markdownlint
    lint-command: "markdownlint --stdin"
    lint-source: "markdownlint"
    lint-formats:
      - "%f:%l:%c %m"
      - "%f:%l %m"
      - "%f: %l: %m"
      - "%-G%.%#"
    lint-stdin: true
    lint-ignore-exit-code: true
    root-markers:
      - .markdownlint.json
      - .markdownlint.yaml
      - .markdownlintrc

  # ============================================================================
  # Containers - hadolint
  # ============================================================================
  hadolint: &hadolint
    lint-command: "hadolint --no-color --format=tty -"
    lint-source: "hadolint"
    lint-formats:
      - "%f:%l %m"
      - "%-G%.%#"
    lint-stdin: true

  # ============================================================================
  # TOML - taplo
  # ============================================================================
  taplo: &taplo
    lint-command: "taplo lint -"
    lint-source: "taplo"
    lint-stdin: true
    lint-formats:
      - "%f:%l:%c: %m"
      - "%-G%.%#"

  # ============================================================================
  # Kotlin - ktlint
  # ============================================================================
  ktlint: &ktlint
    lint-command: "ktlint --stdin"
    lint-source: "ktlint"
    lint-stdin: true
    lint-formats:
      - "%f:%l:%c: %m"
      - "%-G%.%#"
    lint-ignore-exit-code: true
    root-markers:
      - .editorconfig
      - build.gradle.kts
      - build.gradle
      - settings.gradle.kts
      - settings.gradle
    lint-category-map:
      E: E
      W: W
      N: I
      S: H

languages:
  go:
    - <<: *golangci-lint

  javascript:
    - <<: *oxlint

  typescript:
    - <<: *oxlint

  javascriptreact:
    - <<: *oxlint

  typescriptreact:
    - <<: *oxlint

  json:
    - <<: *json-jq

  python:
    - <<: *python-ruff
    - <<: *python-mypy

  sql:
    - <<: *sqlfluff

  sh:
    - <<: *shellcheck

  bash:
    - <<: *shellcheck

  zsh:
    - <<: *shellcheck

  yaml:
    - <<: *yamllint

  markdown:
    - <<: *markdownlint

  dockerfile:
    - <<: *hadolint

  toml:
    - <<: *taplo

  vue:
    - <<: *oxlint

  svelte:
    - <<: *oxlint

  kotlin:
    - <<: *ktlint
