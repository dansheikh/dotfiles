# Set "256 color" as terminal mode
# set -g default-terminal "tmux-256color"

# Set 24-bit color
set -sa terminal-overrides ",*:RGB"

# Enable mouse
set -g mouse on

# Unbind original prefix (Ctrl-b)
unbind C-b

# Set C-Space as prefix
set -g prefix C-Space

# Ensure C-Space is usable by all applications
bind C-Space send-prefix

# Set delay for prefix and command combination
set -sg escape-time 1

# Set 1 as the base index for windows
set -g base-index 1

# Set 1 as the base index for panes
set -gw pane-base-index 1

# Enable window renumbering
set -g renumber-windows on

# Enable configuration reload with prefix + r
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Reloaded!"

# Configure default shell
set -g default-shell $SHELL

# Universally reattach to user namespace
set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Set pane split bindings
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Set pane movement bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set window movement bindings
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Set pane resizing bindings
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Set copy and choice mode key bindings
set -gw mode-keys vi

# Set status line key bindings
set -gw status-keys vi

# Set clipboard bindings
# bind-key -T copy-mode-emacs C-w send -X copy-pipe-and-cancel "xsel -i"
# bind-key -T copy-mode-emacs M-w send -X copy-pipe-and-cancel "xsel -i"

# bind-key -n -T emacs-copy M-w copy-pipe "xclip -i -sel p -f | xclip -i -sel c"
# bind-key -n C-y run "xclip -o | tmux load-buffer - ; tmux paste-buffer"

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i"
# bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

bind-key -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -i"

# Disable mouse support
set -g mouse off

# Enable aggressive window resizing
set -gw aggressive-resize

# Enable xterm keys
# set -gw xterm-keys on

# Set non-login shell as default command
set -g default-command "${SHELL}"

# Enable terminal focus events
set -g focus-events on

# Enable activity alerts
set -gw monitor-activity on
set -g visual-activity on

# Set cursor style
set -g cursor-style blinking-block

# Set status position
set -g status-position bottom

# Set plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

set -g @catppuccin_flavour 'mocha'

# Initialize plugin manager
run "${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm"
