# =============================================================================
# Terminal
# =============================================================================

# Set terminal type explicitly (required for correct color/feature detection)
set -g default-terminal "tmux-256color"

# 24-bit true color
set -sa terminal-overrides ",*:RGB"
set -sa terminal-features ",*:RGB"
set -sa terminal-overrides ",*:Tc"

# Undercurl and colored underlines (Neovim LSP diagnostics, etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# =============================================================================
# Core settings
# =============================================================================

# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reduce escape-time for Neovim (eliminates mode-switch lag)
set -sg escape-time 0

# 1-based indexing for windows and panes
set -g base-index 1
set -gw pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Large scrollback
set -g history-limit 50000

# Enable mouse
set -g mouse on

# OSC 52 clipboard passthrough (SSH, Kitty, WezTerm, iTerm2)
set -g set-clipboard on

# Pass focus events through to applications (Neovim autoread)
set -g focus-events on

# Activity alerts: highlight window flag only, no status-bar message
set -gw monitor-activity on
set -g visual-activity off

# Aggressive resize: use smallest attached client dimensions
set -gw aggressive-resize on

# Default shell
set -g default-shell $SHELL
set -g default-command "${SHELL}"

# Cursor style
set -g cursor-style blinking-block

# Status bar position
set -g status-position bottom

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Reloaded!"

# Splits: open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window: open in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -r p select-window -t :-
bind -r n select-window -t :+
bind Tab last-window

# Pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fallback clear-screen when C-l is consumed by Neovim passthrough
bind C-l send-keys C-l

# =============================================================================
# Neovim / pane navigation passthrough
#
# C-h/j/k/l: move between tmux panes, or pass through to Neovim when it is
# running in the active pane. No plugin required on either side.
# =============================================================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Also handle passthrough when in copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# =============================================================================
# Copy mode
# =============================================================================

set -gw mode-keys vi
set -gw status-keys vi

bind-key -T copy-mode-vi v   send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
# Yank is handled by tmux-yank; no manual xsel/xclip bindings needed

# =============================================================================
# Popups
# =============================================================================

bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind b display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "ranger"
bind t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "${SHELL}"

# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme (official plugin, v2 API)
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_modules_right 'session date_time'
set -g @catppuccin_status_modules_left 'null'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'

# Initialize TPM (must be last)
run "${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm"
