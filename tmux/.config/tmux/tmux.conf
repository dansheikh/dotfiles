# =============================================================================
# Terminal & Rendering
# =============================================================================

# Explicit terminal capability
set -g default-terminal "tmux-256color"

# 24-bit true color, RGB, and CSI-u extended key forwarding
set -sa terminal-features ",*:RGB"
set -sa terminal-features ",*:extkeys"
set -sa terminal-overrides ",*:Tc"

# Undercurl & colored underlines (Eglot / Flymake / Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Extended keys (CSI-u) for Kitty, WezTerm, and Alacritty -> Emacs 31+ TUI
set -g extended-keys on
set -g extended-keys-format csi-u

# Allow OSC 52 / terminal escape passthrough (for Emacs TUI clipboard & images)
set -g allow-passthrough on

# Pass focus events through to applications (Emacs auto-revert / focus hooks)
set -g focus-events on

# Forward COLORTERM from client terminals into tmux sessions
set -ga update-environment "COLORTERM"

# =============================================================================
# Core Ergonomics
# =============================================================================

# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Zero escape-time for responsive modal editing (eliminates Evil/Vim ESC lag)
set -sg escape-time 0

# 1-based indexing for windows and panes
set -g base-index 1
set -gw pane-base-index 1

# Automatically renumber windows sequentially when one is closed
set -g renumber-windows on

# Scrollback history
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Clipboard integration (OSC 52)
set -g set-clipboard on

# Smart window naming: dynamically tracks current running command,
# but yields cleanly to manual renames (prefix + ,)
set -gw automatic-rename on
set -gw automatic-rename-format "#{pane_current_command}"

# Activity & visual alerts: silent, no screen flashing
set -gw monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# Aggressive resize
set -gw aggressive-resize on

# Default shell
set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

# Cursor style
set -g cursor-style blinking-block

# =============================================================================
# Status Bar (Catppuccin Macchiato — Rounded Pills & Micro-Dot Indicators)
# =============================================================================

set -g status-position top
set -g status "on"
set -g status-interval 2
set -g status-justify "left"

# Grounding bar background (Macchiato Crust #181926 for high pill contrast)
set -g status-style "bg=#181926,fg=#cad3f5"
set -g status-left-length 100
set -g status-right-length 100

# -----------------------------------------------------------------------------
# Left: Session Pill (Macchiato Mauve capsule on Crust)
# -----------------------------------------------------------------------------
set -g status-left "#[fg=#c6a0f6,bg=#181926]#[fg=#181926,bg=#c6a0f6,bold]󰖯 #S#[fg=#c6a0f6,bg=#181926] "

# -----------------------------------------------------------------------------
# Right: Multi-Segment Rounded Pills (Date/Time & Host)
# -----------------------------------------------------------------------------
set -g status-right "#[fg=#363a4f,bg=#181926]#[fg=#a5adcb,bg=#363a4f]%Y-%m-%d #[fg=#5b6078,bg=#363a4f]| #[fg=#cad3f5,bg=#363a4f,bold]%H:%M#[fg=#363a4f,bg=#181926] #[fg=#8aadf4,bg=#181926]#[fg=#181926,bg=#8aadf4,bold]#h#[fg=#8aadf4,bg=#181926] "

# -----------------------------------------------------------------------------
# Window Tabs (Zero-Shift Balanced Geometry & Medium Indicator Dot)
# -----------------------------------------------------------------------------
set -gw window-status-separator " "

# Inactive Tab (Macchiato Base #24273a, Subtext0 #a5adcb)
set -gw window-status-format "#[fg=#24273a,bg=#181926]#[fg=#a5adcb,bg=#24273a]  #I:#W #[fg=#24273a,bg=#181926]"

# Active Tab (Macchiato Surface1 #494d64, Green dot #a6da95, Text #cad3f5, Peach zoom #f5a97f)
set -gw window-status-current-format "#[fg=#494d64,bg=#181926]#[fg=#a6da95,bg=#494d64,bold]• #[fg=#cad3f5,bg=#494d64,bold]#I:#W #[fg=#494d64,bg=#181926]#{?window_zoomed_flag, #[fg=#f5a97f,bg=#181926]#[fg=#181926,bg=#f5a97f,bold]󰁌#[fg=#f5a97f,bg=#181926],}"

# -----------------------------------------------------------------------------
# Copy-Mode & Search Prompt Styling
# -----------------------------------------------------------------------------
set -gw mode-style "bg=#f5a97f,fg=#1e2030,bold"
set -g copy-mode-match-style "bg=#5b6078,fg=#f5a97f"
set -g copy-mode-current-match-style "bg=#f5a97f,fg=#1e2030,bold"

# Command prompt styling
set -g message-style "bg=#363a4f,fg=#8aadf4,bold"
set -g message-command-style "bg=#363a4f,fg=#f5a97f,bold"

# -----------------------------------------------------------------------------
# Panes & Borders
# -----------------------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-indicators both
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"

# Popup styling
set -g popup-border-lines rounded
set -g popup-border-style "fg=#494d64"

# =============================================================================
# Key Bindings
# =============================================================================

# Reload configuration
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message " Config reloaded!"

# Window splitting in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Restore automatic window naming (clears manual prefix + , override)
bind A set-window-option automatic-rename on \; display-message " Window auto-naming restored"

# Reorder windows horizontally
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Window navigation
bind -r p select-window -t :-
bind -r n select-window -t :+
bind Tab last-window

# Pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fallback clear-screen when C-l is consumed by editor passthrough
bind C-l send-keys C-l

# =============================================================================
# Emacs / Neovim / Pane Navigation Passthrough
# =============================================================================

is_editor="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|l?n?vim?x?|fzf)(diff)?|emacs(client)?)$'"

bind -n C-h if-shell "$is_editor" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_editor" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_editor" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_editor" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# =============================================================================
# Copy Mode (Vi Ergonomics)
# =============================================================================

set -gw mode-keys vi
set -gw status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Direct search keys in copy-mode open the interactive FZF popup
bind -T copy-mode-vi / display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

bind -T copy-mode-vi ? display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

# =============================================================================
# Popups (Modernized UI & FZF Workflows)
# =============================================================================

# Floating FZF Session and Window Switcher
bind s display-popup -E -w 75% -h 65% -b rounded -T " Switch Session / Window " \
  "tmux list-windows -a -F '#{session_name}:#{window_index} - #{window_name} (#{pane_current_command})' | \
   fzf --reverse --prompt='Jump to > ' | cut -d' ' -f1 | \
   xargs -I{} tmux select-window -t {}"

# Floating FZF Scrollback Search
bind / display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

# Lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " lazygit " -E "lazygit"

# Yazi file manager popup
bind y display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " yazi " -E "yazi"
bind b display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " yazi " -E "yazi"

# Scratchpad terminal popup
bind t display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " scratch " -E "${SHELL}"

# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (must remain at the very bottom)
run "${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm"
