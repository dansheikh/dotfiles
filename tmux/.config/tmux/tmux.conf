# =============================================================================
# Terminal & Rendering
# =============================================================================

# Explicit terminal capability
set -g default-terminal "tmux-256color"

# 24-bit true color and RGB support
set -sa terminal-features ",*:RGB"
set -sa terminal-overrides ",*:Tc"

# Undercurl & colored underlines (Neovim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass focus events through to applications (e.g. Neovim autoread)
set -g focus-events on

# =============================================================================
# Core Ergonomics
# =============================================================================

# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Zero escape-time for responsive modal editing (eliminates mode-switch lag)
set -sg escape-time 0

# 1-based indexing for windows and panes
set -g base-index 1
set -gw pane-base-index 1

# Automatically renumber windows sequentially when one is closed
set -g renumber-windows on

# Scrollback history
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Clipboard integration (OSC 52 passthrough)
set -g set-clipboard on

# Smart window naming: dynamically tracks current running command,
# but yields cleanly to manual renames (prefix + ,)
set -gw automatic-rename on
set -gw automatic-rename-format "#{pane_current_command}"

# Activity & visual alerts: silent, no screen flashing
set -gw monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# Aggressive resize
set -gw aggressive-resize on

# Default shell
set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

# Cursor style
set -g cursor-style blinking-block

# =============================================================================
# Status Bar (Contrasted Rounded Pills & Micro-Dot Indicators)
# =============================================================================

set -g status-position top
set -g status "on"
set -g status-interval 2
set -g status-justify "left"

# Grounding bar background (Catppuccin Crust #11111b for high pill contrast)
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g status-left-length 100
set -g status-right-length 100

# -----------------------------------------------------------------------------
# Left: Session Pill (Mauve capsule on Crust)
# -----------------------------------------------------------------------------
set -g status-left "#[fg=#cba6f7,bg=#11111b]#[fg=#11111b,bg=#cba6f7,bold]󰖯 #S#[fg=#cba6f7,bg=#11111b] "

# -----------------------------------------------------------------------------
# Right: Multi-Segment Rounded Pills (Date/Time & Host)
# -----------------------------------------------------------------------------
set -g status-right "#[fg=#313244,bg=#11111b]#[fg=#a6adc8,bg=#313244]%Y-%m-%d #[fg=#585b70,bg=#313244]| #[fg=#cdd6f4,bg=#313244,bold]%H:%M#[fg=#313244,bg=#11111b] #[fg=#89b4fa,bg=#11111b]#[fg=#11111b,bg=#89b4fa,bold]#h#[fg=#89b4fa,bg=#11111b] "

# -----------------------------------------------------------------------------
# Window Tabs (Zero-Shift Balanced Geometry & Medium Indicator Dot)
# -----------------------------------------------------------------------------
set -gw window-status-separator " "

# Inactive Tab:
# - Dot omitted: balanced with symmetrical spaces around the title
# - Retains identical character column count as active state to prevent resizing
set -gw window-status-format "#[fg=#1e1e2e,bg=#11111b]#[fg=#a6adc8,bg=#1e1e2e]  #I:#W #[fg=#1e1e2e,bg=#11111b]"

# Active Tab:
# - Mocha Green medium dot (•, U+2022) + trailing space matching inactive padding
# - Adjacent Zoom Indicator: Displayed outside the main pill to preserve dimensions
set -gw window-status-current-format "#[fg=#45475a,bg=#11111b]#[fg=#a6e3a1,bg=#45475a,bold]• #[fg=#cdd6f4,bg=#45475a,bold]#I:#W #[fg=#45475a,bg=#11111b]#{?window_zoomed_flag, #[fg=#fab387,bg=#11111b]#[fg=#11111b,bg=#fab387,bold]󰁌#[fg=#fab387,bg=#11111b],}"

# -----------------------------------------------------------------------------
# Copy-Mode & Search Prompt Styling
# -----------------------------------------------------------------------------
set -gw mode-style "bg=#fab387,fg=#181825,bold"
set -g copy-mode-match-style "bg=#585b70,fg=#fab387"
set -g copy-mode-current-match-style "bg=#fab387,fg=#181825,bold"

# Command prompt styling
set -g message-style "bg=#313244,fg=#89b4fa,bold"
set -g message-command-style "bg=#313244,fg=#fab387,bold"

# -----------------------------------------------------------------------------
# Panes & Borders
# -----------------------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-indicators both
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Popup styling
set -g popup-border-lines rounded
set -g popup-border-style "fg=#45475a"

# =============================================================================
# Key Bindings
# =============================================================================

# Reload configuration
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message " Config reloaded!"

# Window splitting in current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Restore automatic window naming (clears manual prefix + , override)
bind < set-window-option automatic-rename on \; display-message " Window auto-naming restored"

# Reorder windows horizontally
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Window navigation
bind -r p select-window -t :-
bind -r n select-window -t :+
bind Tab last-window

# Pane resizing (prefix + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Fallback clear-screen when C-l is consumed by Neovim passthrough
bind C-l send-keys C-l

# =============================================================================
# Neovim / Pane Navigation Passthrough
# =============================================================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# =============================================================================
# Copy Mode (Vi Ergonomics)
# =============================================================================

set -gw mode-keys vi
set -gw status-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Direct search keys in copy-mode open the interactive FZF popup
bind -T copy-mode-vi / display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

bind -T copy-mode-vi ? display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

# =============================================================================
# Popups (Modernized UI & FZF Workflows)
# =============================================================================

# Floating FZF Session and Window Switcher
bind s display-popup -E -w 75% -h 65% -b rounded -T " Switch Session / Window " \
  "tmux list-windows -a -F '#{session_name}:#{window_index} - #{window_name} (#{pane_current_command})' | \
   fzf --reverse --prompt='Jump to > ' | cut -d' ' -f1 | \
   xargs -I{} tmux select-window -t {}"

# Floating FZF Scrollback Search
bind / display-popup -w 85% -h 75% -b rounded -T " Search Scrollback " -E \
  "~/.local/bin/tmux-fzf-scrollback.sh #{pane_id}"

# Lazygit popup
bind g display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " lazygit " -E "lazygit"

# Yazi file manager popup
bind y display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " yazi " -E "yazi"
bind b display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " yazi " -E "yazi"

# Scratchpad terminal popup
bind t display-popup -d "#{pane_current_path}" -w 85% -h 85% -b rounded -T " scratch " -E "${SHELL}"

# =============================================================================
# Plugins (TPM)
# =============================================================================

set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM (must remain at the very bottom)
run "${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm"
